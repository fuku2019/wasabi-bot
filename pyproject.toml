[project]
name = "wasabi-discord-bot"
version = "0.1.0"
description = "A Discord bot that posts wasabi messages on a schedule."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4.0",
    "python-dotenv>=1.0.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
