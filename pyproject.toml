[project]
name = "wasabi-bot"
version = "0.1.0"
description = "A Discord bot that posts wasabi messages on a schedule."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
wasabi-bot = "wasabi_bot.bot:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 120
